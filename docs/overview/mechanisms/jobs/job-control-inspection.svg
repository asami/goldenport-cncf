<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">CNCF Job control and inspection</title>
  <desc id="desc">Detailed view of authorized Job control commands, owner-aware inspection APIs, Job Entity projection, diagnostic payloads, lifecycle events and user-notification separation.</desc>
  <defs>
    <linearGradient id="header" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#0B1F33"/><stop offset="1" stop-color="#153B5B"/></linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#17324D" flood-opacity=".10"/></filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5 0 10z" fill="#2367D1"/></marker>
    <style>
      .bg{fill:#F7F9FC}.h1{font:700 38px Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#fff}.sub{font:400 18px Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#CFE0F0}.badge{font:700 12px Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;letter-spacing:.5px}.meta{font:500 12px Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#CFE0F0}.label{font:700 14px Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;letter-spacing:1px;fill:#52697D}.title{font:700 21px Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#102A43}.body{font:500 14px Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#243B53}.small{font:500 12px Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#334E68}.muted{font:400 12px Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#627D98}.mono{font:600 13px "SFMono-Regular",Consolas,monospace;fill:#243B53}.chip{font:700 10px Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;letter-spacing:.3px}.foot{font:400 12px Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#829AB1}
    </style>
  </defs>
  <rect class="bg" width="1600" height="900"/><rect width="1600" height="138" fill="url(#header)"/>
  <circle cx="78" cy="69" r="31" fill="#0F8F82"/><circle cx="78" cy="69" r="12" fill="none" stroke="#fff" stroke-width="4"/><path d="M78 47v8M78 83v8M56 69h8M92 69h8" stroke="#fff" stroke-width="4" stroke-linecap="round"/>
  <text x="128" y="61" class="h1">Job Control + Inspection</text><text x="130" y="91" class="sub">Operational authority, read models, diagnostics, projections and Event integration</text>
  <rect x="1248" y="35" width="154" height="32" rx="16" fill="#DFF7EB"/><circle cx="1269" cy="51" r="6" fill="#218A55"/><text x="1283" y="56" class="badge" fill="#17663F">AVAILABLE</text>
  <text x="1435" y="50" class="meta">Updated</text><text x="1435" y="72" class="badge" fill="#fff">2026-07-25</text>

  <text x="70" y="179" class="label">CONTROL PLANE</text><line x1="220" y1="174" x2="1530" y2="174" stroke="#D9E2EC"/>
  <g filter="url(#shadow)"><rect x="70" y="208" width="300" height="248" rx="16" fill="#fff" stroke="#D9E2EC" stroke-width="1.5"/></g>
  <text x="98" y="246" class="title">Caller + security context</text><text x="98" y="280" class="body">Job owner or management capability</text><text x="98" y="314" class="small">job_control · job_admin</text><text x="98" y="342" class="small">content_manager · content_admin</text>
  <rect x="98" y="380" width="218" height="42" rx="9" fill="#F0F5FA"/><text x="207" y="406" text-anchor="middle" class="mono">ExecutionContext</text>
  <line x1="386" y1="332" x2="426" y2="332" stroke="#2367D1" stroke-width="3" marker-end="url(#arrow)"/>

  <g filter="url(#shadow)"><rect x="440" y="208" width="300" height="248" rx="16" fill="#EEF4FF" stroke="#AFCBFA" stroke-width="1.5"/></g>
  <text x="468" y="246" class="title">JobControlPolicy</text><text x="468" y="280" class="body">Authorize before transition</text><text x="468" y="314" class="small">Cancel · Retry</text><text x="468" y="342" class="small">Suspend · Resume</text>
  <rect x="468" y="380" width="218" height="42" rx="9" fill="#DDEAFF"/><text x="577" y="406" text-anchor="middle" class="mono">JobControlRequest</text>
  <line x1="756" y1="332" x2="796" y2="332" stroke="#2367D1" stroke-width="3" marker-end="url(#arrow)"/>

  <g filter="url(#shadow)"><rect x="810" y="208" width="300" height="248" rx="16" fill="#fff" stroke="#A9DCCF" stroke-width="1.5"/></g>
  <text x="838" y="246" class="title">JobEngine transition</text><text x="838" y="280" class="body">Validate current lifecycle state</text><text x="838" y="314" class="small">async response or bounded await</text><text x="838" y="342" class="small">active cancellation scope propagated</text>
  <rect x="838" y="380" width="218" height="42" rx="9" fill="#EAF8F1"/><text x="947" y="406" text-anchor="middle" class="mono">JobControlResponse</text>
  <line x1="1126" y1="332" x2="1166" y2="332" stroke="#2367D1" stroke-width="3" marker-end="url(#arrow)"/>

  <g filter="url(#shadow)"><rect x="1180" y="208" width="350" height="248" rx="16" fill="#fff" stroke="#A9DCCF" stroke-width="1.5"/></g>
  <text x="1208" y="246" class="title">Observable consequence</text><text x="1208" y="280" class="body">Status + timeline + result update</text><text x="1208" y="314" class="small">Lifecycle Event when applicable</text><text x="1208" y="342" class="small">No silent or implicit state mutation</text>
  <rect x="1208" y="380" width="248" height="42" rx="9" fill="#EAF8F1"/><text x="1332" y="406" text-anchor="middle" class="small">Monotonic lifecycle record</text>

  <text x="70" y="514" class="label">INSPECTION AND PROJECTION</text><line x1="330" y1="509" x2="1530" y2="509" stroke="#D9E2EC"/>
  <g filter="url(#shadow)"><rect x="70" y="540" width="338" height="236" rx="16" fill="#fff" stroke="#A9DCCF" stroke-width="1.5"/></g>
  <text x="98" y="578" class="title">Authorized read model</text><text x="98" y="610" class="body">Owner or job_view/job_admin</text><text x="98" y="642" class="small">query · list · status · result · await</text><text x="98" y="670" class="small">persistent-only listing by default</text>
  <rect x="98" y="708" width="238" height="34" rx="17" fill="#DFF7EB"/><text x="217" y="730" text-anchor="middle" class="chip" fill="#17663F">JobQueryReadModel</text>

  <g filter="url(#shadow)"><rect x="430" y="540" width="338" height="236" rx="16" fill="#fff" stroke="#A9DCCF" stroke-width="1.5"/></g>
  <text x="458" y="578" class="title">Diagnostic structure</text><text x="458" y="610" class="body">Task page · timeline page</text><text x="458" y="642" class="small">Task Execution Tree · Task detail</text><text x="458" y="670" class="small">task-local calltree · metrics</text>
  <rect x="458" y="708" width="238" height="34" rx="17" fill="#DFF7EB"/><text x="577" y="730" text-anchor="middle" class="chip" fill="#17663F">JOB-SPECIFIC EVIDENCE</text>

  <g filter="url(#shadow)"><rect x="790" y="540" width="338" height="236" rx="16" fill="#fff" stroke="#A9DCCF" stroke-width="1.5"/></g>
  <text x="818" y="578" class="title">Management projection</text><text x="818" y="610" class="body">Job Entity for search/admin UX</text><text x="818" y="642" class="small">JobEngine remains execution authority</text><text x="818" y="670" class="small">large payloads remain externalized</text>
  <rect x="818" y="708" width="238" height="34" rx="17" fill="#DFF7EB"/><text x="937" y="730" text-anchor="middle" class="chip" fill="#17663F">LIGHTWEIGHT SYSTEM ENTITY</text>

  <g filter="url(#shadow)"><rect x="1150" y="540" width="380" height="236" rx="16" fill="#fff" stroke="#E3C66E" stroke-width="1.5"/></g>
  <text x="1178" y="578" class="title">Lifecycle Event routing</text><text x="1178" y="610" class="body">succeeded · failed · cancelled</text><text x="1178" y="642" class="small">recovery-required</text><text x="1178" y="670" class="small">notification forwarding is separate/non-fatal</text>
  <rect x="1178" y="708" width="278" height="34" rx="17" fill="#FFF3D6"/><text x="1317" y="730" text-anchor="middle" class="chip" fill="#855800">JOBENGINE KNOWS NO USER NOTIFICATION</text>

  <rect x="70" y="808" width="1460" height="42" rx="10" fill="#EAF0F5"/><text x="100" y="834" class="chip" fill="#334E68">CONTROL CHANGES EXECUTION STATE</text><text x="520" y="834" class="chip" fill="#334E68">INSPECTION READS JOB-SPECIFIC RECORDS</text><text x="1000" y="834" class="chip" fill="#334E68">PROJECTION AND NOTIFICATION ARE DOWNSTREAM</text>
  <text x="70" y="883" class="foot">Overview: overview.svg</text><text x="1530" y="883" text-anchor="end" class="foot">Evidence: JobControlCommandSpec · JobQueryReadModelSpec · Phase 22</text>
</svg>
