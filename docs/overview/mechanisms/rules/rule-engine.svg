  <text x="510" y="251" class="title">RuleEngine.evaluate</text><text x="510" y="279" class="muted">RuleEngine SPI · InferenceEngine SPI · Built-in baseline</text>
  <rect x="510" y="306" width="102" height="30" rx="15" fill="#E4EDFF"/><text x="561" y="326" text-anchor="middle" class="chip" fill="#1F5AB6">CONSTRAINT</text>
  <rect x="622" y="306" width="113" height="30" rx="15" fill="#E4F7F3"/><text x="678.5" y="326" text-anchor="middle" class="chip" fill="#08796D">CALCULATION</text>
  <rect x="745" y="306" width="126" height="30" rx="15" fill="#F0E9FF"/><text x="808" y="326" text-anchor="middle" class="chip" fill="#7048A8">DECISION TABLE</text>
  <rect x="881" y="306" width="93" height="30" rx="15" fill="#FFF3D6"/><text x="927.5" y="326" text-anchor="middle" class="chip" fill="#9A6500">DERIVATION</text>
  <rect x="632" y="349" width="102" height="30" rx="15" fill="#FFE9E5"/><text x="683" y="369" text-anchor="middle" class="chip" fill="#A34A36">PRODUCTION</text>
  <line x1="510" y1="402" x2="974" y2="402" stroke="#C3D5EA"/>
  <circle cx="525" cy="429" r="5" fill="#2367D1"/><text x="542" y="434" class="body">Canonical priority + Rule identifier order</text>
  <circle cx="525" cy="463" r="5" fill="#2367D1"/><text x="542" y="468" class="body">Exact decimal; no floating-point or text coercion</text>
  <circle cx="525" cy="497" r="5" fill="#2367D1"/><text x="542" y="502" class="body">No store, I/O, provider call or runtime action</text>
  <line x1="1022" y1="367" x2="1068" y2="367" stroke="#2367D1" stroke-width="3" marker-end="url(#arrow)"/>

  <g filter="url(#shadow)"><rect x="1082" y="210" width="448" height="315" rx="18" fill="#fff" stroke="#A9DCCF" stroke-width="1.5"/></g>
  <text x="1115" y="251" class="title">RuleEvaluationResult</text><text x="1115" y="279" class="muted">Immutable, normalized and structurally explainable</text>
  <circle cx="1120" cy="315" r="5" fill="#0F8F82"/><text x="1137" y="320" class="body">Calculation values · decision results</text>
  <circle cx="1120" cy="350" r="5" fill="#0F8F82"/><text x="1137" y="355" class="body">Constraint violations</text>
  <circle cx="1120" cy="385" r="5" fill="#0F8F82"/><text x="1137" y="390" class="body">Derived Facts + provenance</text>
  <circle cx="1120" cy="420" r="5" fill="#0F8F82"/><text x="1137" y="425" class="body">ActionPlans — values only, never executed</text>
  <circle cx="1120" cy="455" r="5" fill="#0F8F82"/><text x="1137" y="460" class="body">Agenda + structural explanations</text>
  <rect x="1115" y="480" width="382" height="28" rx="14" fill="#DFF7EB"/><text x="1306" y="499" text-anchor="middle" class="chip" fill="#17663F">EVALUATION IS COMPLETE HERE</text>

  <text x="70" y="577" class="label">RULE FAMILY → RESULT</text><line x1="260" y1="572" x2="1530" y2="572" stroke="#D9E2EC"/>
  <g>
    <rect x="70" y="603" width="280" height="145" rx="15" fill="#fff" stroke="#C9D8E7"/><rect x="70" y="603" width="280" height="8" rx="4" fill="#2367D1"/><text x="94" y="645" class="smalltitle">Constraint</text><text x="94" y="674" class="small">Report violations or</text><text x="94" y="697" class="small">return structured rejection</text>
    <rect x="365" y="603" width="280" height="145" rx="15" fill="#fff" stroke="#C9D8E7"/><rect x="365" y="603" width="280" height="8" rx="4" fill="#0F8F82"/><text x="389" y="645" class="smalltitle">Calculation</text><text x="389" y="674" class="small">Return exact scalar or</text><text x="389" y="697" class="small">Record-shaped values</text>
    <rect x="660" y="603" width="280" height="145" rx="15" fill="#fff" stroke="#C9D8E7"/><rect x="660" y="603" width="280" height="8" rx="4" fill="#7048A8"/><text x="684" y="645" class="smalltitle">Decision Table</text><text x="684" y="674" class="small">Return selected row, output</text><text x="684" y="697" class="small">and canonical candidates</text>
    <rect x="955" y="603" width="280" height="145" rx="15" fill="#fff" stroke="#C9D8E7"/><rect x="955" y="603" width="280" height="8" rx="4" fill="#D99000"/><text x="979" y="645" class="smalltitle">Derivation</text><text x="979" y="674" class="small">Return new immutable Facts</text><text x="979" y="697" class="small">after bounded fixed point</text>
    <rect x="1250" y="603" width="280" height="145" rx="15" fill="#fff" stroke="#C9D8E7"/><rect x="1250" y="603" width="280" height="8" rx="4" fill="#C45A42"/><text x="1274" y="645" class="smalltitle">Production</text><text x="1274" y="674" class="small">Return immutable ActionPlans</text><text x="1274" y="697" class="small">for optional later admission</text>
  </g>

  <rect x="70" y="779" width="1460" height="54" rx="12" fill="#EAF0F5"/>
  <text x="105" y="812" class="chip" fill="#334E68">DETERMINISTIC</text><circle cx="250" cy="806" r="3" fill="#829AB1"/>
  <text x="275" y="812" class="chip" fill="#334E68">IMMUTABLE</text><circle cx="388" cy="806" r="3" fill="#829AB1"/>
  <text x="413" y="812" class="chip" fill="#334E68">EXACT DECIMAL</text><circle cx="560" cy="806" r="3" fill="#829AB1"/>
  <text x="585" y="812" class="chip" fill="#334E68">PROVIDER-NEUTRAL SPI</text><circle cx="800" cy="806" r="3" fill="#829AB1"/>
  <text x="825" y="812" class="chip" fill="#334E68">PAYLOAD-SAFE</text><circle cx="964" cy="806" r="3" fill="#829AB1"/>
  <text x="989" y="812" class="chip" fill="#334E68">NO AMBIENT LOOKUP</text><circle cx="1184" cy="806" r="3" fill="#829AB1"/>
  <text x="1209" y="812" class="chip" fill="#334E68">NO ACTION EXECUTION</text>
