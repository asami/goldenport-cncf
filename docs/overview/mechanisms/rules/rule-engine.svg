<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">CNCF Rule Engine core capability overview</title>
  <desc id="desc">Focused Rule field detail showing the implemented Phase 32 flow from immutable inputs through pure deterministic evaluation to an explainable result. Evaluation ends at the result and does not execute action plans.</desc>
  <defs>
    <linearGradient id="header" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#0B1F33"/><stop offset="1" stop-color="#153B5B"/></linearGradient>
    <linearGradient id="engine" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#EAF2FF"/><stop offset="1" stop-color="#F5F8FF"/></linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#17324D" flood-opacity=".10"/></filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5 0 10z" fill="#2367D1"/></marker>
    <style>
      .bg{fill:#F7F9FC}.h1{font:700 38px Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#fff}.sub{font:400 18px Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#CFE0F0}.badge{font:700 13px Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;letter-spacing:.6px}.meta{font:500 12px Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#CFE0F0}.label{font:700 14px Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;letter-spacing:1px;fill:#52697D}.title{font:700 24px Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#102A43}.smalltitle{font:700 18px Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#102A43}.body{font:500 16px Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#243B53}.small{font:500 14px Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#334E68}.muted{font:400 13px Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#627D98}.mono{font:600 14px "SFMono-Regular",Consolas,monospace;fill:#243B53}.chip{font:700 12px Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;letter-spacing:.2px}.foot{font:400 12px Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#829AB1}
    </style>
  </defs>
  <rect class="bg" width="1600" height="900"/>
  <rect width="1600" height="138" fill="url(#header)"/>
  <circle cx="78" cy="69" r="31" fill="#2367D1"/><path d="M61 69h34M78 52v34M66 57l24 24M90 57L66 81" stroke="#fff" stroke-width="4" stroke-linecap="round"/>
  <text x="128" y="61" class="h1">Rule Engine Core</text>
  <text x="130" y="91" class="sub">Provider-neutral, pure and explainable rule evaluation</text>
  <rect x="1125" y="35" width="142" height="32" rx="16" fill="#DFF7EB"/><circle cx="1146" cy="51" r="6" fill="#218A55"/><text x="1160" y="56" class="badge" fill="#17663F">AVAILABLE</text>
  <rect x="1279" y="35" width="176" height="32" rx="16" fill="#E7F0FF"/><text x="1298" y="56" class="badge" fill="#1F5AB6">PHASE 32 CLOSED</text>
  <text x="1470" y="50" class="meta">Updated</text><text x="1470" y="72" class="badge" fill="#fff">2026-07-25</text>

  <text x="70" y="177" class="label">PURE EVALUATION — COMPLETE AT THE RESULT</text><line x1="430" y1="172" x2="1530" y2="172" stroke="#D9E2EC"/>

  <g filter="url(#shadow)"><rect x="70" y="210" width="330" height="315" rx="18" fill="#fff" stroke="#D9E2EC" stroke-width="1.5"/></g>
  <text x="102" y="251" class="title">Immutable inputs</text><text x="102" y="279" class="muted">CNCF-owned request values</text>
  <rect x="102" y="304" width="266" height="55" rx="10" fill="#F0F5FA"/><text x="122" y="328" class="mono">RuleSet</text><text x="122" y="347" class="muted">identity · version · ordered Rules</text>
  <rect x="102" y="372" width="266" height="55" rx="10" fill="#F0F5FA"/><text x="122" y="396" class="mono">RuleProgram</text><text x="122" y="415" class="muted">typed executable instructions</text>
  <rect x="102" y="440" width="266" height="55" rx="10" fill="#F0F5FA"/><text x="122" y="464" class="mono">WorkingMemory</text><text x="122" y="483" class="muted">Facts · type · attributes · provenance</text>
  <line x1="416" y1="367" x2="462" y2="367" stroke="#2367D1" stroke-width="3" marker-end="url(#arrow)"/>

