  <circle cx="108" cy="515" r="5" fill="#2367D1"/><text x="125" y="520" class="body">Select RuleProgram</text>
  <circle cx="108" cy="550" r="5" fill="#2367D1"/><text x="125" y="555" class="body">Project inputs to Facts</text>
  <line x1="366" y1="491" x2="418" y2="491" stroke="#2367D1" stroke-width="3" marker-end="url(#arrow)"/>

  <g filter="url(#shadow)"><rect x="432" y="365" width="280" height="252" rx="18" fill="#fff" stroke="#D9E2EC" stroke-width="1.5"/></g>
  <text x="464" y="410" class="title">Evaluation request</text><text x="464" y="439" class="muted">Immutable CNCF values</text>
  <rect x="464" y="466" width="216" height="38" rx="8" fill="#F0F5FA"/><text x="480" y="490" class="mono">RuleSet</text>
  <rect x="464" y="514" width="216" height="38" rx="8" fill="#F0F5FA"/><text x="480" y="538" class="mono">RuleProgram</text>
  <rect x="464" y="562" width="216" height="38" rx="8" fill="#F0F5FA"/><text x="480" y="586" class="mono">WorkingMemory</text>
  <line x1="728" y1="491" x2="780" y2="491" stroke="#2367D1" stroke-width="3" marker-end="url(#arrow)"/>

  <g filter="url(#shadow)"><rect x="794" y="365" width="280" height="252" rx="18" fill="#EEF4FF" stroke="#AFCBFA" stroke-width="1.5"/></g>
  <text x="826" y="410" class="title">RuleEngineSocket</text><text x="826" y="439" class="muted">Resolved provider + tracing</text>
  <rect x="826" y="475" width="216" height="70" rx="12" fill="#DDEAFF"/><text x="934" y="505" text-anchor="middle" class="mono">evaluate</text><text x="934" y="529" text-anchor="middle" class="small">pure · deterministic</text>
  <rect x="826" y="562" width="216" height="30" rx="15" fill="#DFF7EB"/><text x="934" y="582" text-anchor="middle" class="chip" fill="#17663F">AVAILABLE</text>
  <line x1="1090" y1="491" x2="1142" y2="491" stroke="#2367D1" stroke-width="3" marker-end="url(#arrow)"/>

  <g filter="url(#shadow)"><rect x="1156" y="365" width="374" height="252" rx="18" fill="#fff" stroke="#A9DCCF" stroke-width="1.5"/></g>
  <text x="1188" y="410" class="title">Application consumes result</text><text x="1188" y="439" class="muted">The normal path ends here</text>
  <circle cx="1194" cy="480" r="5" fill="#0F8F82"/><text x="1211" y="485" class="body">Use calculation / decision output</text>
  <circle cx="1194" cy="515" r="5" fill="#0F8F82"/><text x="1211" y="520" class="body">Handle Report / Reject</text>
  <circle cx="1194" cy="550" r="5" fill="#0F8F82"/><text x="1211" y="555" class="body">Use derived Facts or inspect plans</text>
  <rect x="1188" y="574" width="310" height="27" rx="13.5" fill="#DFF7EB"/><text x="1343" y="593" text-anchor="middle" class="chip" fill="#17663F">NO FIRE REQUIRED</text>

  <text x="70" y="670" class="label">REPRESENTATIVE USES</text><line x1="260" y1="665" x2="1530" y2="665" stroke="#D9E2EC"/>
  <rect x="70" y="695" width="345" height="112" rx="14" fill="#fff" stroke="#D9E2EC"/><text x="98" y="733" class="title">Tax calculation</text><text x="98" y="765" class="small">Explicit × Calculation × Return</text>
  <rect x="435" y="695" width="345" height="112" rx="14" fill="#fff" stroke="#D9E2EC"/><text x="463" y="733" class="title">Price selection</text><text x="463" y="765" class="small">Explicit × DecisionTable × Return</text>
  <rect x="800" y="695" width="345" height="112" rx="14" fill="#fff" stroke="#D9E2EC"/><text x="828" y="733" class="title">Eligibility check</text><text x="828" y="765" class="small">Explicit × Constraint × Report / Reject</text>
  <rect x="1165" y="695" width="365" height="112" rx="14" fill="#fff" stroke="#D9E2EC"/><text x="1193" y="733" class="title">Fact inference</text><text x="1193" y="765" class="small">Explicit × Derivation × Derive</text>
  <text x="70" y="873" class="foot">Mechanisms: ../../mechanisms/rules/rule-engine.svg · ../../mechanisms/rules/component-rule-integration.svg</text><text x="1530" y="873" text-anchor="end" class="foot">Status: available in Phase 32</text>
