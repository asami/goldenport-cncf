<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Application-driven Rule evaluation use case</title>
  <desc id="desc">Focused Rule use case in which application logic explicitly builds facts, evaluates a typed RuleProgram through RuleEngineSocket, and consumes the immutable result without mandatory action firing.</desc>
  <defs>
    <linearGradient id="header" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#0B1F33"/><stop offset="1" stop-color="#153B5B"/></linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#17324D" flood-opacity=".10"/></filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5 0 10z" fill="#2367D1"/></marker>
    <style>
      .bg{fill:#F7F9FC}.h1{font:700 38px Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#fff}.sub{font:400 18px Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#CFE0F0}.badge{font:700 13px Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;letter-spacing:.6px}.meta{font:500 12px Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#CFE0F0}.label{font:700 14px Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;letter-spacing:1px;fill:#52697D}.title{font:700 22px Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#102A43}.body{font:500 15px Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#243B53}.small{font:500 13px Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#334E68}.muted{font:400 13px Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#627D98}.mono{font:600 14px "SFMono-Regular",Consolas,monospace;fill:#243B53}.chip{font:700 11px Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;letter-spacing:.35px}.foot{font:400 12px Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#829AB1}
    </style>
  </defs>
  <rect class="bg" width="1600" height="900"/><rect width="1600" height="138" fill="url(#header)"/>
  <circle cx="78" cy="69" r="31" fill="#2367D1"/><path d="M59 69h38M86 58l11 11-11 11" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="128" y="61" class="h1">Application-driven Rule Evaluation</text><text x="130" y="91" class="sub">Application logic explicitly asks the Rule Engine for a decision</text>
  <rect x="1220" y="35" width="142" height="32" rx="16" fill="#DFF7EB"/><circle cx="1241" cy="51" r="6" fill="#218A55"/><text x="1255" y="56" class="badge" fill="#17663F">AVAILABLE</text>
  <text x="1435" y="50" class="meta">Updated</text><text x="1435" y="72" class="badge" fill="#fff">2026-07-25</text>

  <text x="70" y="177" class="label">USE-CASE PROFILE</text><line x1="220" y1="172" x2="1530" y2="172" stroke="#D9E2EC"/>
  <rect x="70" y="197" width="1460" height="92" rx="14" fill="#fff" stroke="#D9E2EC"/>
  <text x="105" y="226" class="muted">ACTIVATION</text><text x="105" y="257" class="title">Explicit</text>
  <line x1="320" y1="214" x2="320" y2="272" stroke="#D9E2EC"/>
  <text x="355" y="226" class="muted">RULE FAMILY</text><text x="355" y="257" class="body">Any typed family</text>
  <line x1="650" y1="214" x2="650" y2="272" stroke="#D9E2EC"/>
  <text x="685" y="226" class="muted">OUTCOME</text><text x="685" y="257" class="body">Return / Report / Reject / Derive / Plan</text>
  <line x1="1135" y1="214" x2="1135" y2="272" stroke="#D9E2EC"/>
  <text x="1170" y="226" class="muted">ADMISSION</text><text x="1170" y="257" class="body">None by default</text>

  <text x="70" y="336" class="label">AVAILABLE PRIMARY PATH</text><line x1="275" y1="331" x2="1530" y2="331" stroke="#D9E2EC"/>
  <g filter="url(#shadow)"><rect x="70" y="365" width="280" height="252" rx="18" fill="#fff" stroke="#D9E2EC" stroke-width="1.5"/></g>
  <text x="102" y="410" class="title">Application logic</text><text x="102" y="439" class="muted">ComponentLogic / ActionCall</text>
