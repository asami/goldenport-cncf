  <line x1="406" y1="515" x2="458" y2="515" stroke="#D99000" stroke-width="3" stroke-dasharray="7 6" marker-end="url(#arrowPlan)"/>

  <g filter="url(#shadow)"><rect x="472" y="365" width="320" height="300" rx="18" fill="#fff" stroke="#E3C66E" stroke-width="1.5"/></g>
  <text x="504" y="410" class="title">Constraint binding</text><text x="504" y="439" class="muted">Selection + automatic Fact projection</text>
  <circle cx="510" cy="480" r="5" fill="#D99000"/><text x="527" y="485" class="body">Select RuleSet / RuleProgram</text>
  <circle cx="510" cy="519" r="5" fill="#D99000"/><text x="527" y="524" class="body">Project runtime values to Facts</text>
  <circle cx="510" cy="558" r="5" fill="#D99000"/><text x="527" y="563" class="body">Choose Report or Reject policy</text>
  <rect x="504" y="604" width="128" height="26" rx="13" fill="#FFF3D6"/><text x="568" y="622" text-anchor="middle" class="chip" fill="#855800">PLANNED</text>
  <line x1="808" y1="515" x2="860" y2="515" stroke="#218A55" stroke-width="3" marker-end="url(#arrowGreen)"/>

  <g filter="url(#shadow)"><rect x="874" y="365" width="300" height="300" rx="18" fill="#EEF4FF" stroke="#AFCBFA" stroke-width="1.5"/></g>
  <text x="906" y="410" class="title">Constraint evaluation</text><text x="906" y="439" class="muted">Rule Engine capability</text>
  <rect x="906" y="480" width="236" height="75" rx="12" fill="#DDEAFF"/><text x="1024" y="510" text-anchor="middle" class="mono">RuleConstraint</text><text x="1024" y="535" text-anchor="middle" class="small">predicate → Report / Reject</text>
  <rect x="906" y="592" width="150" height="28" rx="14" fill="#DFF7EB"/><text x="981" y="611" text-anchor="middle" class="chip" fill="#17663F">AVAILABLE</text>
  <line x1="1190" y1="515" x2="1242" y2="515" stroke="#D99000" stroke-width="3" stroke-dasharray="7 6" marker-end="url(#arrowPlan)"/>

  <g filter="url(#shadow)"><rect x="1256" y="365" width="274" height="300" rx="18" fill="#fff" stroke="#E3C66E" stroke-width="1.5"/></g>
  <text x="1288" y="410" class="title">Framework outcome</text><text x="1288" y="439" class="muted">Automatic application is planned</text>
  <rect x="1288" y="480" width="210" height="56" rx="10" fill="#FFF7E3"/><text x="1307" y="504" class="mono">Report</text><text x="1307" y="524" class="small">attach violations</text>
  <rect x="1288" y="548" width="210" height="56" rx="10" fill="#FFF7E3"/><text x="1307" y="572" class="mono">Reject</text><text x="1307" y="592" class="small">stop current operation</text>
  <rect x="1288" y="617" width="128" height="26" rx="13" fill="#FFF3D6"/><text x="1352" y="635" text-anchor="middle" class="chip" fill="#855800">PLANNED</text>

  <rect x="70" y="703" width="1460" height="104" rx="15" fill="#fff" stroke="#D9E2EC"/>
  <text x="100" y="740" class="title">Important boundary</text>
  <text x="100" y="772" class="body">Generated datatype and operation-parameter validation remain separate today; RuleConstraint does not automatically intercept them.</text>
  <rect x="1218" y="732" width="280" height="42" rx="21" fill="#FFF3D6"/><text x="1358" y="758" text-anchor="middle" class="chip" fill="#855800">EVALUATOR READY · BINDING MISSING</text>
  <text x="70" y="873" class="foot">Mechanisms: ../../mechanisms/rules/rule-engine.svg · ../../mechanisms/rules/component-rule-integration.svg</text><text x="1530" y="873" text-anchor="end" class="foot">Status: partial — automatic lifecycle integration is not implemented</text>
