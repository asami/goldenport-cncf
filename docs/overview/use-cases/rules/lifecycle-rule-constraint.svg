<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Lifecycle-bound Rule constraint use case</title>
  <desc id="desc">Focused partial Rule use case for automatically applying an available Rule Constraint evaluator at Operation, Entity, UnitOfWork, or Event lifecycle boundaries. Automatic bindings are planned.</desc>
  <defs>
    <linearGradient id="header" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#0B1F33"/><stop offset="1" stop-color="#153B5B"/></linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#17324D" flood-opacity=".10"/></filter>
    <marker id="arrowPlan" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5 0 10z" fill="#D99000"/></marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5 0 10z" fill="#218A55"/></marker>
    <style>
      .bg{fill:#F7F9FC}.h1{font:700 38px Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#fff}.sub{font:400 18px Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#CFE0F0}.badge{font:700 13px Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;letter-spacing:.6px}.meta{font:500 12px Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#CFE0F0}.label{font:700 14px Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;letter-spacing:1px;fill:#52697D}.title{font:700 22px Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#102A43}.body{font:500 15px Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#243B53}.small{font:500 13px Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#334E68}.muted{font:400 13px Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#627D98}.mono{font:600 14px "SFMono-Regular",Consolas,monospace;fill:#243B53}.chip{font:700 11px Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;letter-spacing:.35px}.foot{font:400 12px Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#829AB1}
    </style>
  </defs>
  <rect class="bg" width="1600" height="900"/><rect width="1600" height="138" fill="url(#header)"/>
  <circle cx="78" cy="69" r="31" fill="#D99000"/><path d="M78 48v17M78 78v12M61 60l12 9M95 60l-12 9" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round"/>
  <text x="128" y="61" class="h1">Lifecycle-bound Rule Constraint</text><text x="130" y="91" class="sub">Automatic validation at framework boundaries — target integration</text>
  <rect x="1210" y="35" width="126" height="32" rx="16" fill="#FFF3D6"/><circle cx="1231" cy="51" r="6" fill="#D99000"/><text x="1245" y="56" class="badge" fill="#855800">PARTIAL</text>
  <text x="1435" y="50" class="meta">Updated</text><text x="1435" y="72" class="badge" fill="#fff">2026-07-25</text>

  <text x="70" y="177" class="label">USE-CASE PROFILE</text><line x1="220" y1="172" x2="1530" y2="172" stroke="#D9E2EC"/>
  <rect x="70" y="197" width="1460" height="92" rx="14" fill="#fff" stroke="#D9E2EC"/>
  <text x="105" y="226" class="muted">ACTIVATION</text><text x="105" y="257" class="title">Lifecycle-bound</text>
  <line x1="375" y1="214" x2="375" y2="272" stroke="#D9E2EC"/>
  <text x="410" y="226" class="muted">RULE FAMILY</text><text x="410" y="257" class="title">Constraint</text>
  <line x1="690" y1="214" x2="690" y2="272" stroke="#D9E2EC"/>
  <text x="725" y="226" class="muted">OUTCOME</text><text x="725" y="257" class="title">Report / Reject</text>
  <line x1="1060" y1="214" x2="1060" y2="272" stroke="#D9E2EC"/>
  <text x="1095" y="226" class="muted">MISSING PIECE</text><text x="1095" y="257" class="body">Automatic lifecycle binding</text>

  <text x="70" y="336" class="label">TARGET FRAMEWORK PATH</text><line x1="280" y1="331" x2="1530" y2="331" stroke="#D9E2EC"/>
  <g filter="url(#shadow)"><rect x="70" y="365" width="320" height="300" rx="18" fill="#fff" stroke="#E3C66E" stroke-width="1.5"/></g>
