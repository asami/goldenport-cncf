<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Monitored condition to Event use case</title>
  <desc id="desc">Focused partial Rule use case in which a monitor, scheduler, incoming event, or job completion activates a production rule that returns an Event ActionPlan for explicit authorized admission.</desc>
