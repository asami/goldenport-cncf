  <rect x="1081" y="478" width="160" height="70" rx="12" fill="#EAF8F1"/><text x="1161" y="507" text-anchor="middle" class="mono">Event</text><text x="1161" y="532" text-anchor="middle" class="small">name · kind · payload</text>
  <rect x="1081" y="592" width="150" height="28" rx="14" fill="#DFF7EB"/><text x="1156" y="611" text-anchor="middle" class="chip" fill="#17663F">AVAILABLE</text>
  <line x1="1287" y1="515" x2="1329" y2="515" stroke="#218A55" stroke-width="3" stroke-dasharray="7 6" marker-end="url(#arrowGreen)"/>

