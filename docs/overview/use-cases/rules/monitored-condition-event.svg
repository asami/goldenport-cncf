  <text x="1373" y="409" class="title">Admission</text><text x="1373" y="437" class="muted">Explicit fire only</text>
  <rect x="1373" y="478" width="142" height="70" rx="12" fill="#EAF8F1"/><text x="1444" y="507" text-anchor="middle" class="mono">EventBus</text><text x="1444" y="532" text-anchor="middle" class="small">publishAuthorized</text>
  <rect x="1373" y="592" width="142" height="28" rx="14" fill="#DFF7EB"/><text x="1444" y="611" text-anchor="middle" class="chip" fill="#17663F">AVAILABLE</text>

  <rect x="70" y="703" width="1460" height="104" rx="15" fill="#fff" stroke="#D9E2EC"/>
  <text x="100" y="740" class="title">Responsibility boundary</text>
  <text x="100" y="772" class="body">The Rule Engine evaluates supplied Facts. It does not poll, schedule, retain temporal windows, or continuously watch external state.</text>
