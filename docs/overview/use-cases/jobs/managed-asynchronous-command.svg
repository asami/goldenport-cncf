<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Managed asynchronous Command with JobAsync</title>
  <desc id="desc">JobAsync returns an accepted Job id, executes through the shared JobEngine priority queue and bounded workers, and exposes retry, control and inspection.</desc>
  <defs>
    <linearGradient id="header" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#0B1F33"/><stop offset="1" stop-color="#153B5B"/></linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#17324D" flood-opacity=".10"/></filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5 0 10z" fill="#218A55"/></marker>
    <style>
      .bg{fill:#F7F9FC}.h1{font:700 38px Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#fff}.sub{font:400 18px Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#CFE0F0}.badge{font:700 12px Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;letter-spacing:.5px}.meta{font:500 12px Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#CFE0F0}.label{font:700 14px Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;letter-spacing:1px;fill:#52697D}.title{font:700 21px Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#102A43}.body{font:500 14px Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#243B53}.small{font:500 12px Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#334E68}.muted{font:400 12px Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#627D98}.mono{font:600 13px "SFMono-Regular",Consolas,monospace;fill:#243B53}.chip{font:700 10px Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;letter-spacing:.3px}.foot{font:400 12px Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#829AB1}
    </style>
  </defs>
  <rect class="bg" width="1600" height="900"/><rect width="1600" height="138" fill="url(#header)"/>
  <circle cx="78" cy="69" r="31" fill="#218A55"/><path d="M62 58h20v20H62zM82 64h12v20H74v-6" fill="none" stroke="#fff" stroke-width="4" stroke-linejoin="round"/>
  <text x="128" y="61" class="h1">Managed Asynchronous Command — JobAsync</text><text x="130" y="91" class="sub">Return a Job id early, then execute through one observable bounded scheduler</text>
  <rect x="1248" y="35" width="154" height="32" rx="16" fill="#DFF7EB"/><circle cx="1269" cy="51" r="6" fill="#218A55"/><text x="1283" y="56" class="badge" fill="#17663F">AVAILABLE</text>
  <text x="1435" y="50" class="meta">Updated</text><text x="1435" y="72" class="badge" fill="#fff">2026-07-25</text>

  <text x="70" y="179" class="label">SUBMISSION AND WORKER FLOW</text><line x1="330" y1="174" x2="1530" y2="174" stroke="#D9E2EC"/>
  <g filter="url(#shadow)"><rect x="70" y="222" width="260" height="258" rx="16" fill="#fff" stroke="#D9E2EC" stroke-width="1.5"/></g>
  <text x="98" y="260" class="title">1 · Submit</text><text x="98" y="297" class="body">Execution policy resolves JobAsync</text><text x="98" y="329" class="small">Create persistent Submitted Job</text><rect x="98" y="358" width="204" height="50" rx="9" fill="#EAF8F1"/><text x="200" y="389" text-anchor="middle" class="mono">JobId / accepted</text><text x="98" y="443" class="muted">Caller does not await work</text>
  <line x1="346" y1="350" x2="386" y2="350" stroke="#218A55" stroke-width="3" marker-end="url(#arrow)"/>

  <g filter="url(#shadow)"><rect x="400" y="222" width="276" height="258" rx="16" fill="#EEF4FF" stroke="#AFCBFA" stroke-width="1.5"/></g>
  <text x="428" y="260" class="title">2 · Shared queue</text><text x="428" y="297" class="body">priority ascending · FIFO</text><text x="428" y="329" class="small">optional one-shot delayed start</text><text x="428" y="357" class="small">retry later rejoins same queue</text><rect x="428" y="390" width="220" height="48" rx="9" fill="#DDEAFF"/><text x="538" y="419" text-anchor="middle" class="mono">SchedulerWorkItem</text>
  <line x1="692" y1="350" x2="732" y2="350" stroke="#218A55" stroke-width="3" marker-end="url(#arrow)"/>

  <g filter="url(#shadow)"><rect x="746" y="222" width="276" height="258" rx="16" fill="#fff" stroke="#A9DCCF" stroke-width="1.5"/></g>
  <text x="774" y="260" class="title">3 · Bounded worker</text><text x="774" y="297" class="body">Detached from caller transaction</text><text x="774" y="329" class="small">worker-side Required Event TX</text><text x="774" y="357" class="small">Task context + cancellation scope</text><rect x="774" y="390" width="220" height="48" rx="9" fill="#EAF8F1"/><text x="884" y="419" text-anchor="middle" class="mono">Running Tasks</text>
  <line x1="1038" y1="350" x2="1078" y2="350" stroke="#218A55" stroke-width="3" marker-end="url(#arrow)"/>

  <g filter="url(#shadow)"><rect x="1092" y="222" width="438" height="258" rx="16" fill="#fff" stroke="#A9DCCF" stroke-width="1.5"/></g>
  <text x="1120" y="260" class="title">4 · Terminal + inspect</text><text x="1120" y="297" class="body">Succeeded / Failed / Cancelled</text><text x="1120" y="329" class="small">result · retry · timeline · Task tree</text><text x="1120" y="357" class="small">query / await / control by JobId</text><rect x="1120" y="390" width="326" height="48" rx="9" fill="#DFF7EB"/><text x="1283" y="419" text-anchor="middle" class="mono">JobQueryReadModel</text>

  <text x="70" y="540" class="label">OPERATIONS DURING AND AFTER EXECUTION</text><line x1="430" y1="535" x2="1530" y2="535" stroke="#D9E2EC"/>
  <g filter="url(#shadow)"><rect x="70" y="568" width="350" height="210" rx="16" fill="#fff" stroke="#A9DCCF" stroke-width="1.5"/></g>
  <text x="98" y="606" class="title">Observe</text><circle cx="104" cy="640" r="5" fill="#218A55"/><text x="121" y="645" class="body">status / result / list</text><circle cx="104" cy="675" r="5" fill="#218A55"/><text x="121" y="680" class="body">timeline / Task tree / detail</text><circle cx="104" cy="710" r="5" fill="#218A55"/><text x="121" y="715" class="body">queue and completion metrics</text>

  <g filter="url(#shadow)"><rect x="444" y="568" width="350" height="210" rx="16" fill="#fff" stroke="#A9DCCF" stroke-width="1.5"/></g>
  <text x="472" y="606" class="title">Control</text><circle cx="478" cy="640" r="5" fill="#218A55"/><text x="495" y="645" class="body">cancel / suspend / resume</text><circle cx="478" cy="675" r="5" fill="#218A55"/><text x="495" y="680" class="body">retry now / delayed retry</text><circle cx="478" cy="710" r="5" fill="#218A55"/><text x="495" y="715" class="body">owner or capability authorization</text>

  <g filter="url(#shadow)"><rect x="818" y="568" width="350" height="210" rx="16" fill="#fff" stroke="#A9DCCF" stroke-width="1.5"/></g>
  <text x="846" y="606" class="title">Recover</text><circle cx="852" cy="640" r="5" fill="#218A55"/><text x="869" y="645" class="body">explicit compensation Actions</text><circle cx="852" cy="675" r="5" fill="#218A55"/><text x="869" y="680" class="body">recovery-required diagnostics</text><circle cx="852" cy="710" r="5" fill="#218A55"/><text x="869" y="715" class="body">lifecycle/recovery Events</text>

  <g filter="url(#shadow)"><rect x="1192" y="568" width="338" height="210" rx="16" fill="#fff" stroke="#D9E2EC" stroke-width="1.5"/></g>
  <text x="1220" y="606" class="title">Scheduler boundary</text><circle cx="1226" cy="640" r="5" fill="#52697D"/><text x="1243" y="645" class="body">No fire-and-forget thread</text><circle cx="1226" cy="675" r="5" fill="#52697D"/><text x="1243" y="680" class="body">No cron/calendar scheduling</text><circle cx="1226" cy="710" r="5" fill="#52697D"/><text x="1243" y="715" class="body">No workflow timer platform</text>

  <rect x="70" y="808" width="1460" height="42" rx="10" fill="#DFF7EB"/><text x="800" y="834" text-anchor="middle" class="chip" fill="#17663F">EARLY JOB ID + SHARED SCHEDULER + CONTROLLABLE AND AUDITABLE TERMINAL OUTCOME</text>
  <text x="70" y="883" class="foot">Mechanisms: ../../mechanisms/jobs/job-engine-runtime.svg · ../../mechanisms/jobs/job-control-inspection.svg</text><text x="1530" y="883" text-anchor="end" class="foot">Status: available</text>
</svg>
